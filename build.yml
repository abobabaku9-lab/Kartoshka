name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.10'

        - name: Install Buildozer dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

        - name: Install Buildozer
          run: pip install --user buildozer

        - name: Initialize Buildozer Spec
          run: |
            # Создаем минимальный конфиг или используем дефолтный
            echo "y" | ~/.local/bin/buildozer init

        - name: Build APK with Buildozer
          run: |
            # Исправляем настройки под наш майн.py
            sed -i 's/# (str) Title of your application/title = Kartoshka Jarenaya/' buildozer.spec
            sed -i 's/# (str) Package name/package.name = kartoshkajarenaya/' buildozer.spec
            sed -i 's/# (str) Package domain/package.domain = org.game/' buildozer.spec
            sed -i 's/# (list) Source files (relative to directory at spec_creation)/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
            sed -i 's/# (list) Application requirements/requirements = python3,pygame/' buildozer.spec
            
            ~/.local/bin/buildozer -v android debug

        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: package
            path: bin/*.apk

